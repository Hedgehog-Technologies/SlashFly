name: Release
run-name: "Release Tag: ${{ github.ref_name }}"

on:
  push:
    tags:
      - '*.*.*/*.*.*'

jobs:
  build-and-release:
    name: Build and create tagged release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag and containing branch
        id: meta
        run: |
          # get full tag name (preserve any '/' in the tag)
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          # ensure remote branches are available
          git fetch origin 'refs/heads/*:refs/remotes/origin/*' || true
          # find remote branches that contain the tagged commit
          branches=$(git branch -r --contains $GITHUB_SHA 2>/dev/null || true)
          # normalize and pick the first branch (strip remote prefix)
          branch=$(echo "$branches" | sed 's#^[[:space:]]*##' | sed 's#^origin/##' | head -n1 || true)
          if [ -z "$branch" ]; then branch="unknown"; fi
          echo "branch=$branch" >> $GITHUB_OUTPUT

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}

      - name: Build (assemble jars)
        shell: bash
        env:
          GRADLE_OPTS: "-Dsun.net.client.defaultConnectTimeout=600000 -Dsun.net.client.defaultReadTimeout=600000"
        run: |
          retries=3
          attempt=1
          until [ $attempt -gt $retries ]
          do
            echo "Attempt $attempt/$retries"
            if [ $attempt -eq 1 ]; then
              bash ./gradlew --no-daemon assemble
            else
              # on retries, force refresh to avoid cached partial failures
              bash ./gradlew --no-daemon assemble --refresh-dependencies
            fi
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "Build succeeded on attempt $attempt"
              break
            fi
            echo "Build failed (exit $rc). Sleeping before retry..."
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done
          if [ $rc -ne 0 ]; then
            echo "Build failed after $retries attempts; run with --stacktrace locally or check runner network access."
            exit $rc
          fi

      - name: Collect jars
        id: gather
        run: |
          mkdir -p release_artifacts
          # copy produced jars from subprojects
          find . -path '*/build/libs/*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print0 | xargs -0 -I{} cp {} release_artifacts/ || true
          ls -la release_artifacts
          # produce a space-separated list for outputs (optional)
          files="$(cd release_artifacts && printf '%s ' *.jar 2>/dev/null || true)"
          echo "files=$files" >> $GITHUB_OUTPUT

      - name: Create GitHub release and upload jars
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }} from branch ${{ steps.meta.outputs.branch }}
          files: release_artifacts/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
